# DB workspace: prod-eu (service-a) — tunnel pane + vi-sql pane.
name = "db-prod-eu"
description = "prod-eu service-a DB — px IAP tunnel + vi-sql"
group = "DB"
working_dir = "~"

[[tabs]]
name = "db"

[[tabs.panes]]
label = "tunnel"
command = "~/dotfiles/scripts/sql-db.sh --env prod-eu --fg"

[[tabs.panes]]
label = "vi-sql"
command = "~/dotfiles/scripts/sql-db.sh --env prod-eu --visql"
split = "right"
ratio = 0.75
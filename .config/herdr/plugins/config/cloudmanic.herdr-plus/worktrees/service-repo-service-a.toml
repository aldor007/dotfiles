# Branch-specific layout: fires when herdr creates/opens a service-repo worktree
# on the dedicated "service-a" branch (e.g. `herdr worktree open .worktrees/service-a`).
# Matches the "service-a" project — tabs rooted at services/service-a inside the worktree.
# Branch-specific beats the repo-only service-repo.toml layout.
repo = "service-repo"
branch = "service-a"

[[tabs]]
name = "kimchi"
command = "env HERDR_AGENT=pi KIMCHI_AGENT_SOURCE=herdr:pi KIMCHI_AGENT_NAME=pi kimchi"
working_dir = "services/service-a"

[[tabs]]
name = "lazygit"
command = "lazygit"
working_dir = "services/service-a"

[[tabs]]
name = "nvim"
command = "nvim ."
working_dir = "services/service-a"

[[tabs]]
name = "shell"
working_dir = "services/service-a"

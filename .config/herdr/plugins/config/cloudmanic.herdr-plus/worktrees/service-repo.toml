# Auto-layout applied to every worktree herdr creates/opens for the service-repo repo.
# The worktree checkout is the root; tabs land at the repo root.
repo = "service-repo"

[[tabs]]
name = "kimchi"
command = "env HERDR_AGENT=pi KIMCHI_AGENT_SOURCE=herdr:pi KIMCHI_AGENT_NAME=pi kimchi"

[[tabs]]
name = "lazygit"
command = "lazygit"

[[tabs]]
name = "nvim"
command = "nvim ."

[[tabs]]
name = "shell"

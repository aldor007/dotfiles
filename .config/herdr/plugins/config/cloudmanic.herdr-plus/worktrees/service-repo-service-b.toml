# Branch-specific layout: fires when herdr creates/opens a service-repo worktree
# on the dedicated "service-b" branch (e.g. `herdr worktree open .worktrees/service-b`).
# Matches the "service-b" project — tabs rooted at services/service-b.
# Branch-specific beats the repo-only service-repo.toml layout.
repo = "service-repo"
branch = "service-b"

[[tabs]]
name = "kimchi"
command = "kimchi"
working_dir = "services/service-b"

[[tabs]]
name = "lazygit"
command = "lazygit"
working_dir = "services/service-b"

[[tabs]]
name = "nvim"
command = "nvim ."
working_dir = "services/service-b"

[[tabs]]
name = "shell"
working_dir = "services/service-b"

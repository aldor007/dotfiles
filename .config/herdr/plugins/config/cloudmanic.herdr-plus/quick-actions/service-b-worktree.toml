name = "service-b worktree"
description = "Fresh throwaway service-repo worktree — asks for the branch name (empty = service-b-<timestamp>)"
type = "form"
command = "herdr worktree create --cwd ~/work/service-repo --branch {{ if .Value }}{{ .Value }}{{ else }}service-b-$(date +%Y%m%d-%H%M%S){{ end }} --label {{ if .Value }}{{ .Value }}{{ else }}service-b-$(date +%m%d-%H%M){{ end }} --focus || read -t 10 _ </dev/tty || true"

[form]
prompt = "Branch name for the new service-b worktree"
placeholder = "e.g. feat/service-b-thing (empty = service-b-<timestamp>)"

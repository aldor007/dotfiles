onboarding = false

# ---- migrated from ~/.tmux.conf ----
[keys]
prefix = "ctrl+a"                       # tmux: set -g prefix C-a
reload_config = "prefix+r"              # tmux: bind r source-file
split_vertical = "prefix+|"             # tmux: bind | split-window -h (side by side)
split_horizontal = "prefix+minus"       # tmux: bind - split-window -v (stacked)
focus_pane_left = "prefix+h"            # tmux: bind h/j/k/l select-pane (defaults match)
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
previous_tab = ["prefix+p", "prefix+ctrl+h"]   # tmux: bind -r C-h select-window :-
next_tab = ["prefix+n", "prefix+ctrl+l"]       # tmux: bind -r C-l select-window :+
resize_pane_left = "prefix+shift+h"     # tmux: bind -r H/J/K/L resize-pane
resize_pane_down = "prefix+shift+j"
resize_pane_up = "prefix+shift+k"
resize_pane_right = "prefix+shift+l"
swap_pane_left = "prefix+alt+h"         # herdr default prefix+shift+h/l (swap) moved here
swap_pane_down = "prefix+alt+j"
swap_pane_up = "prefix+alt+k"
swap_pane_right = "prefix+alt+l"
new_tab = "prefix+c"
copy_mode = ["prefix+[", "prefix+esc"]  # tmux: bind Escape copy-mode (vi-style copy mode is herdr default)

# tmux: new-window -c "#{pane_current_path}"
[terminal]
new_cwd = "follow"

# Solarized status bar replacement (235=#262626 240=#585858 136=#af8700 166=#d75f00 244=#808080 33=#0087ff)
[ui]
tab_bar_position = "bottom"

tab_bar_right = [
  { type = "hostname" },
  { type = "datetime", format = "%H:%M" },
]
accent = "rgb(215,95,0)"

# glab-status plugin: render the $mr token on a third row of each workspace entry
[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["branch", "git_status"], ["$mr"]]

[theme]
name = "terminal"

auto_switch = false
[theme.custom]
panel_bg = "#262626"
surface_dim = "#585858"
text = "#af8700"
subtext0 = "#808080"
accent = "#d75f00"
yellow = "#af8700"
blue = "#0087ff"

# ---- existing herdr settings (unchanged) ----
[ui.sound]
enabled = false

# command-center plugin: one popup for all plugin actions
[[keys.command]]
key = "prefix+b"
type = "plugin_action"
command = "cdragon.command-center.open"
description = "Open Command Center"

# glab-status plugin: prefix+shift+m refreshes all MR statuses, prefix+shift+o opens the MR
[[keys.command]]
key = "prefix+shift+m"
type = "plugin_action"
command = "glab-status.refresh"
description = "refresh GitLab MR status"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "glab-status.open-mr"
description = "open GitLab MR"

# herdr-plus plugin: prefix+up opens the Projects browser (one workspace
# per service, rendered locally by scripts/dotfiles-init.sh)
# prefix+down opens the Quick Actions fuzzy launcher (worktree actions etc).
[[keys.command]]
key = "prefix+up"
type = "plugin_action"
command = "cloudmanic.herdr-plus.projects"
description = "herdr-plus: projects"

[[keys.command]]
key = "prefix+down"
type = "plugin_action"
command = "cloudmanic.herdr-plus.quick-actions"
description = "herdr-plus: quick actions"

# reviewr plugin: toggle the code-review + file-viewer sidebar pane
[[keys.command]]
key = "prefix+v"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "reviewr: toggle pane"

# mr-review: GitLab MR AI review launcher in a session-modal popup
# (prefix+shift+v is free: reviewr owns prefix+v, resize owns shift+h/j/k/l).
# Publishing lives in mr-review-publish and always asks for confirmation.
[[keys.command]]
key = "prefix+shift+v"
type = "popup"
command = "mr-review"
description = "MR review: GitLab AI review"

# token-dashboard plugin: live token spend across agent panes
[[keys.command]]
key = "prefix+$"
type = "plugin_action"
command = "dave.token-dashboard.open-dashboard"
description = "token dashboard"

# herdr-jira plugin: browse Jira (castai.atlassian.net) in a split / tab
# (prefix+j / prefix+shift+j are taken by tmux-style focus/resize bindings)
[[keys.command]]
key = "prefix+i"
type = "plugin_action"
command = "herdr-jira.open-jira"
description = "Jira (split)"

[[keys.command]]
key = "prefix+shift+i"
type = "plugin_action"
command = "herdr-jira.open-jira-tab"
description = "Jira (tab)"

# herdr-bar: fuzzy jump to any tab/agent/workspace/repo/branch (Cmd+K style).
# Auto tab titles for unnamed Claude/Codex tabs are enabled by default.
# NOTE: prefix+k was taken by focus_pane_up — the bar lives on prefix+space;
# optionally mirror ⌘K later via a ctrl+alt+k chord (see herdr-bar README).
[[keys.command]]
key = "prefix+space"
type = "plugin_action"
command = "herdr-bar.open"
description = "command bar (jump to tab/agent)"

# herdr-nvim: persistent nvim sidebar — prefix+e toggles the sidebar,
# prefix+f opens the agent-touched file picker. (prefix+o stays herdr-projects.)
[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar: toggle"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "nvim sidebar: open file from agent output"

# herdr-projects: multi-agent board (each agent on its own branch + reviewer).
# State lives in ~/.herdr-projects (not repo-managed).
[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "herdr-projects.open"
description = "projects: agent mission board"

[ui.toast]
delivery = "terminal"

# rainfrog config — dotfiles-managed. NO secrets here: connections are
# passed at runtime as a fresh IAM DSN via `sql-db.sh --rainfrog`
# (or prompted), so nothing in this file can leak credentials.
mouse_mode = true

# [db]
# Frequently-used named connections would go here, e.g.:
#   dev-postgres = { host = "127.0.0.1", driver = "postgres", port = 15432, database = "service-a", username = "marcin@cast.ai" }
# Prefer `sql-db.sh --rainfrog` instead — the IAM token rotates ~hourly,
# so a static password in this file would silently break.